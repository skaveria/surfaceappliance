<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Amber Clock</title>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #030200;
      --panel: #090600;

      --amber: #ffb000;
      --amber-core: #ffc43d;
      --amber-hot: #ffe19a;
      --amber-white: #fff1bd;
      --amber-dim: #b87800;
      --amber-faint: #573700;

      --phosphor-shadow: rgba(255, 174, 0, 0.75);
      --phosphor-glow: rgba(255, 196, 61, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 38%,
          #171000 0%,
          #060400 58%,
          #010100 100%
        );
      color: var(--amber);
      font-family: "VT323", monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255, 183, 0, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 183, 0, 0.025) 1px,
          transparent 1px
        );
      background-size: 8px 8px;
      opacity: 0.48;
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 210, 100, 0.016) 0,
          rgba(255, 210, 100, 0.016) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(
          circle at center,
          transparent 45%,
          rgba(0, 0, 0, 0.82) 100%
        );
    }

    #app {
      width: min(94vw, 1280px);
      padding: clamp(18px, 3.5vw, 46px);
      border: 1px solid rgba(255, 190, 50, 0.28);
      border-radius: 18px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 187, 45, 0.035),
          rgba(0, 0, 0, 0.42)
        ),
        var(--panel);
      box-shadow:
        0 0 20px rgba(255, 174, 0, 0.14),
        0 0 65px rgba(255, 174, 0, 0.08),
        inset 0 0 45px rgba(255, 185, 20, 0.035),
        0 30px 80px rgba(0, 0, 0, 0.9);
      position: relative;
      animation: cabinet-flicker 9s steps(1, end) infinite;
    }

    @keyframes cabinet-flicker {
      0%,
      96%,
      100% {
        opacity: 1;
      }

      97% {
        opacity: 0.985;
      }

      98% {
        opacity: 0.997;
      }
    }

    .glass-panel {
      position: relative;
      border: 1px solid rgba(255, 190, 40, 0.16);
      border-radius: 12px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 190, 45, 0.025),
          rgba(0, 0, 0, 0.24)
        ),
        #050400;
      box-shadow:
        inset 0 0 38px rgba(255, 177, 0, 0.035),
        inset 0 0 3px rgba(255, 226, 155, 0.12);
      overflow: hidden;
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          110deg,
          transparent 0%,
          rgba(255, 230, 170, 0.025) 42%,
          transparent 49%
        );
      z-index: 3;
    }

    .glass-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255, 190, 35, 0.055) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 190, 35, 0.035) 1px,
          transparent 1px
        );
      background-size: 7px 7px;
      opacity: 0.32;
    }

    #display {
      display: grid;
      grid-template-columns: 1fr minmax(220px, 0.34fr);
      gap: clamp(16px, 3vw, 34px);
      padding: clamp(16px, 3vw, 34px);
    }

    #main,
    #wind-panel,
    #graph-content {
      position: relative;
      z-index: 1;
    }

    #main {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #wind-panel {
      border-left: 1px solid rgba(255, 190, 40, 0.2);
      padding-left: clamp(14px, 2vw, 28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #label,
    #wind-label,
    #graph-label {
      color: var(--amber-dim);
      font-family: "VT323", monospace;
      font-size: clamp(18px, 2vw, 26px);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.86;
      text-shadow:
        0 0 5px rgba(255, 174, 0, 0.25);
    }

    #label,
    #wind-label {
      margin-bottom: 1.2vw;
    }

    #time {
      color: var(--amber-white);
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: clamp(74px, 13vw, 180px);
      letter-spacing: -0.04em;
      line-height: 0.95;
      text-shadow:
        0 0 1px rgba(255, 248, 212, 1),
        0 0 4px rgba(255, 222, 130, 1),
        0 0 9px rgba(255, 190, 35, 0.95),
        0 0 19px rgba(255, 170, 0, 0.68),
        0 0 38px rgba(255, 145, 0, 0.38);
      filter: contrast(1.12) saturate(1.05);
      animation: phosphor-breathe 4.8s ease-in-out infinite;
    }

    @keyframes phosphor-breathe {
      0%,
      100% {
        filter: brightness(1) contrast(1.12);
      }

      50% {
        filter: brightness(1.055) contrast(1.15);
      }
    }

    #seconds {
      font-size: 0.32em;
      margin-left: 0.2em;
      opacity: 0.76;
    }

    #weather,
    #wind-speed {
      color: var(--amber-core);
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(20px, 3vw, 42px);
      opacity: 0.92;
      text-shadow:
        0 0 3px rgba(255, 225, 145, 0.45),
        0 0 9px rgba(255, 174, 0, 0.32);
    }

    #weather {
      margin-top: clamp(16px, 2.5vw, 30px);
    }

    #date {
      margin-top: 10px;
      color: var(--amber-dim);
      font-family: "VT323", monospace;
      font-size: clamp(20px, 2.2vw, 30px);
      letter-spacing: 0.08em;
      opacity: 0.82;
    }

    .colon {
      animation: blink 2s steps(1, end) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.2;
      }
    }

    #compass {
      width: min(18vw, 180px);
      aspect-ratio: 1;
      margin-bottom: clamp(14px, 2vw, 24px);
      position: relative;
      border: 1px solid rgba(255, 190, 45, 0.58);
      border-radius: 50%;
      box-shadow:
        0 0 12px rgba(255, 174, 0, 0.24),
        inset 0 0 28px rgba(255, 174, 0, 0.055);
    }

    #compass::before,
    #compass::after {
      content: "";
      position: absolute;
      background: rgba(255, 183, 20, 0.13);
    }

    #compass::before {
      left: 50%;
      top: 15%;
      bottom: 15%;
      width: 1px;
    }

    #compass::after {
      top: 50%;
      left: 15%;
      right: 15%;
      height: 1px;
    }

    .dir {
      position: absolute;
      color: var(--amber-dim);
      font-family: "VT323", monospace;
      font-size: clamp(18px, 2vw, 26px);
      text-shadow: 0 0 5px rgba(255, 174, 0, 0.3);
      z-index: 2;
    }

    .n {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
    }

    .e {
      right: 8%;
      top: 50%;
      transform: translateY(-50%);
    }

    .s {
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
    }

    .w {
      left: 8%;
      top: 50%;
      transform: translateY(-50%);
    }

    #needle {
      position: absolute;
      inset: 12%;
      z-index: 1;
      transition: transform 800ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #needle::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 8%;
      width: 3px;
      height: 45%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--amber-white);
      box-shadow:
        0 0 3px rgba(255, 245, 205, 1),
        0 0 9px rgba(255, 190, 40, 0.95),
        0 0 18px rgba(255, 160, 0, 0.58);
    }

    #needle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--amber-white);
      box-shadow:
        0 0 6px rgba(255, 225, 145, 1),
        0 0 14px rgba(255, 174, 0, 0.8);
    }

    #wind-dir {
      margin-top: 8px;
      color: var(--amber-dim);
      font-family: "VT323", monospace;
      font-size: clamp(20px, 2.2vw, 30px);
    }

    #graph-panel {
      margin-top: clamp(16px, 2vw, 28px);
      padding: clamp(14px, 2vw, 24px);
    }

    #graph-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    #graph-readout {
      color: var(--amber-core);
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(16px, 2vw, 27px);
      opacity: 0.92;
      white-space: nowrap;
      text-shadow:
        0 0 4px rgba(255, 218, 120, 0.42),
        0 0 10px rgba(255, 174, 0, 0.25);
    }

    #graph-stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: clamp(170px, 21vh, 240px);
    }

    #trend-graph {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .graph-grid {
      stroke: rgba(255, 190, 40, 0.15);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .graph-grid.minor {
      stroke: rgba(255, 190, 40, 0.07);
    }

    .graph-fill {
      fill: url("#temperature-fill");
    }

    .graph-afterglow {
      fill: none;
      stroke: rgba(255, 176, 0, 0.3);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: url("#wide-glow");
    }

    .graph-line {
      fill: none;
      stroke: var(--amber-core);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: url("#line-glow");
      animation: trace-pulse 3.6s ease-in-out infinite;
    }

    @keyframes trace-pulse {
      0%,
      100% {
        stroke-opacity: 0.86;
      }

      50% {
        stroke-opacity: 1;
      }
    }

    .graph-cursor-line {
      stroke: rgba(255, 225, 150, 0.48);
      stroke-width: 1;
      stroke-dasharray: 3 4;
      vector-effect: non-scaling-stroke;
      filter: url("#small-glow");
    }

    .graph-cursor-halo {
      fill: rgba(255, 177, 0, 0.25);
      filter: url("#wide-glow");
    }

    .graph-cursor-dot {
      fill: var(--amber-white);
      stroke: var(--amber-core);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      filter: url("#point-glow");
    }

    .graph-scan-dot {
      fill: var(--amber-hot);
      filter: url("#point-glow");
      opacity: 0.72;
    }

    .graph-axis-label {
      fill: var(--amber-dim);
      font-family: "VT323", monospace;
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    #graph-live-value {
      fill: var(--amber-hot);
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px;
      font-weight: 500;
      filter: url("#small-glow");
    }

    @media (max-width: 760px) {
      html,
      body {
        overflow: auto;
      }

      #display {
        grid-template-columns: 1fr;
      }

      #wind-panel {
        border-top: 1px solid rgba(255, 190, 40, 0.2);
        border-left: 0;
        padding-top: 24px;
        padding-left: 0;
      }

      #compass {
        width: min(48vw, 220px);
      }

      #graph-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      #graph-stage {
        height: 190px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="display" class="glass-panel">
      <div id="main">
        <div id="label">digital chronometer</div>

        <div id="time">
          --<span class="colon">:</span>--<span id="seconds">--</span>
        </div>

        <div id="weather">loading weather...</div>
        <div id="date"></div>
      </div>

      <div id="wind-panel">
        <div id="wind-label">wind</div>

        <div id="compass">
          <div class="dir n">N</div>
          <div class="dir e">E</div>
          <div class="dir s">S</div>
          <div class="dir w">W</div>
          <div id="needle"></div>
        </div>

        <div id="wind-speed">-- mph</div>
        <div id="wind-dir">---</div>
      </div>
    </div>

    <div id="graph-panel" class="glass-panel">
      <div id="graph-content">
        <div id="graph-header">
          <div id="graph-label">24 hour temperature</div>
          <div id="graph-readout">forecast pending</div>
        </div>

        <div id="graph-stage">
          <svg
            id="trend-graph"
            viewBox="0 0 720 210"
            preserveAspectRatio="xMidYMid meet"
          >
            <defs>
              <linearGradient
                id="temperature-fill"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >
                <stop
                  offset="0%"
                  stop-color="#ffc43d"
                  stop-opacity="0.18"
                />
                <stop
                  offset="55%"
                  stop-color="#ffb000"
                  stop-opacity="0.07"
                />
                <stop
                  offset="100%"
                  stop-color="#ff9d00"
                  stop-opacity="0"
                />
              </linearGradient>

              <filter
                id="line-glow"
                x="-30%"
                y="-100%"
                width="160%"
                height="300%"
              >
                <feGaussianBlur
                  stdDeviation="2.4"
                  result="blur"
                />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <filter
                id="wide-glow"
                x="-40%"
                y="-150%"
                width="180%"
                height="400%"
              >
                <feGaussianBlur stdDeviation="6" />
              </filter>

              <filter
                id="small-glow"
                x="-80%"
                y="-100%"
                width="260%"
                height="300%"
              >
                <feGaussianBlur
                  stdDeviation="1.8"
                  result="blur"
                />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <filter
                id="point-glow"
                x="-250%"
                y="-250%"
                width="600%"
                height="600%"
              >
                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"
                />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <g id="grid-lines">
              <line
                class="graph-grid minor"
                x1="20"
                y1="32"
                x2="700"
                y2="32"
              />
              <line
                class="graph-grid"
                x1="20"
                y1="70"
                x2="700"
                y2="70"
              />
              <line
                class="graph-grid minor"
                x1="20"
                y1="108"
                x2="700"
                y2="108"
              />
              <line
                class="graph-grid"
                x1="20"
                y1="146"
                x2="700"
                y2="146"
              />

              <line
                class="graph-grid minor"
                x1="190"
                y1="20"
                x2="190"
                y2="164"
              />
              <line
                class="graph-grid minor"
                x1="360"
                y1="20"
                x2="360"
                y2="164"
              />
              <line
                class="graph-grid minor"
                x1="530"
                y1="20"
                x2="530"
                y2="164"
              />
            </g>

            <path
              id="graph-fill"
              class="graph-fill"
              d=""
            />

            <path
              id="graph-afterglow"
              class="graph-afterglow"
              d=""
            />

            <path
              id="graph-line"
              class="graph-line"
              d=""
            />

            <line
              id="graph-cursor-line"
              class="graph-cursor-line"
              x1="20"
              y1="20"
              x2="20"
              y2="164"
              visibility="hidden"
            />

            <circle
              id="graph-cursor-halo"
              class="graph-cursor-halo"
              cx="20"
              cy="90"
              r="11"
              visibility="hidden"
            />

            <circle
              id="graph-cursor-dot"
              class="graph-cursor-dot"
              cx="20"
              cy="90"
              r="4.5"
              visibility="hidden"
            />

            <circle
              id="graph-scan-dot"
              class="graph-scan-dot"
              cx="20"
              cy="90"
              r="2.8"
              visibility="hidden"
            />

            <text
              id="graph-live-value"
              x="30"
              y="82"
              visibility="hidden"
            >
              --°
            </text>

            <text
              id="graph-time-start"
              class="graph-axis-label"
              x="20"
              y="194"
              text-anchor="start"
            ></text>

            <text
              id="graph-time-quarter"
              class="graph-axis-label"
              x="190"
              y="194"
              text-anchor="middle"
            ></text>

            <text
              id="graph-time-middle"
              class="graph-axis-label"
              x="360"
              y="194"
              text-anchor="middle"
            ></text>

            <text
              id="graph-time-three-quarter"
              class="graph-axis-label"
              x="530"
              y="194"
              text-anchor="middle"
            ></text>

            <text
              id="graph-time-end"
              class="graph-axis-label"
              x="700"
              y="194"
              text-anchor="end"
            ></text>
          </svg>
        </div>
      </div>
    </div>
  </div>

<script>
const WEATHER_URL =
  'https://api.open-meteo.com/v1/forecast' +
  '?latitude=34.007' +
  '&longitude=-109.1567' +
  '&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m' +
  '&hourly=temperature_2m' +
  '&temperature_unit=fahrenheit' +
  '&wind_speed_unit=mph' +
  '&forecast_days=2' +
  '&timezone=auto';

const WEATHER_CODES = {
  0: 'Clear',
  1: 'Mostly clear',
  2: 'Partly cloudy',
  3: 'Overcast',
  45: 'Fog',
  48: 'Rime fog',
  51: 'Light drizzle',
  53: 'Drizzle',
  55: 'Heavy drizzle',
  61: 'Light rain',
  63: 'Rain',
  65: 'Heavy rain',
  71: 'Light snow',
  73: 'Snow',
  75: 'Heavy snow',
  80: 'Rain showers',
  81: 'Rain showers',
  82: 'Heavy showers',
  95: 'Thunderstorm',
  96: 'Thunderstorm',
  99: 'Thunderstorm'
};

const graphState = {
  timestamps: [],
  temperatures: [],
  points: [],
  lowerBound: 0,
  upperBound: 1,
  startTimestamp: 0,
  endTimestamp: 0,
  ready: false
};

const GRAPH = {
  left: 20,
  right: 700,
  top: 20,
  bottom: 164
};

function updateTime() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat([], {
    hour: 'numeric',
    minute: '2-digit',
    second: '2-digit'
  }).formatToParts(now);

  const hour =
    parts.find(part => part.type === 'hour')?.value || '--';

  const minute =
    parts.find(part => part.type === 'minute')?.value || '--';

  const second =
    parts.find(part => part.type === 'second')?.value || '--';

  document.getElementById('time').innerHTML =
    `${hour}` +
    `<span class="colon">:</span>` +
    `${minute}` +
    `<span id="seconds">${second}</span>`;

  document.getElementById('date').textContent =
    now.toLocaleDateString([], {
      weekday: 'long',
      month: 'long',
      day: 'numeric'
    });
}

function compassLabel(degrees) {
  const directions = [
    'N',
    'NE',
    'E',
    'SE',
    'S',
    'SW',
    'W',
    'NW'
  ];

  return directions[
    Math.round(degrees / 45) % directions.length
  ];
}

function formatGraphTime(timestamp) {
  return new Date(timestamp).toLocaleTimeString([], {
    hour: 'numeric'
  });
}

function temperatureToY(temperature) {
  const graphHeight = GRAPH.bottom - GRAPH.top;
  const span = graphState.upperBound - graphState.lowerBound;

  const normalized =
    (temperature - graphState.lowerBound) / span;

  return GRAPH.bottom - normalized * graphHeight;
}

function timestampToX(timestamp) {
  const graphWidth = GRAPH.right - GRAPH.left;
  const duration =
    graphState.endTimestamp - graphState.startTimestamp;

  const progress =
    (timestamp - graphState.startTimestamp) / duration;

  return GRAPH.left + progress * graphWidth;
}

function buildSmoothPath(points) {
  if (points.length < 2) {
    return '';
  }

  let path =
    `M ${points[0][0].toFixed(2)} ` +
    `${points[0][1].toFixed(2)}`;

  for (let index = 0; index < points.length - 1; index++) {
    const current = points[index];
    const next = points[index + 1];

    const controlX =
      current[0] + (next[0] - current[0]) / 2;

    path +=
      ` C ${controlX.toFixed(2)} ${current[1].toFixed(2)},` +
      ` ${controlX.toFixed(2)} ${next[1].toFixed(2)},` +
      ` ${next[0].toFixed(2)} ${next[1].toFixed(2)}`;
  }

  return path;
}

function renderTemperatureGraph(timestamps, temperatures) {
  if (
    !Array.isArray(timestamps) ||
    !Array.isArray(temperatures) ||
    timestamps.length < 2 ||
    temperatures.length < 2
  ) {
    document.getElementById('graph-readout').textContent =
      'forecast unavailable';

    return;
  }

  const minimum = Math.min(...temperatures);
  const maximum = Math.max(...temperatures);
  const temperatureSpan = Math.max(1, maximum - minimum);
  const padding = Math.max(3, temperatureSpan * 0.18);

  graphState.timestamps = timestamps;
  graphState.temperatures = temperatures;
  graphState.lowerBound = minimum - padding;
  graphState.upperBound = maximum + padding;
  graphState.startTimestamp = timestamps[0];
  graphState.endTimestamp = timestamps[timestamps.length - 1];

  graphState.points = temperatures.map(
    (temperature, index) => [
      timestampToX(timestamps[index]),
      temperatureToY(temperature)
    ]
  );

  const linePath = buildSmoothPath(graphState.points);
  const lastPoint =
    graphState.points[graphState.points.length - 1];

  const fillPath =
    linePath +
    ` L ${lastPoint[0].toFixed(2)} ${GRAPH.bottom}` +
    ` L ${GRAPH.left} ${GRAPH.bottom} Z`;

  document
    .getElementById('graph-line')
    .setAttribute('d', linePath);

  document
    .getElementById('graph-afterglow')
    .setAttribute('d', linePath);

  document
    .getElementById('graph-fill')
    .setAttribute('d', fillPath);

  document.getElementById('graph-readout').textContent =
    `${Math.round(minimum)}° — ${Math.round(maximum)}°F`;

  const finalIndex = timestamps.length - 1;
  const quarterIndex = Math.round(finalIndex * 0.25);
  const middleIndex = Math.round(finalIndex * 0.5);
  const threeQuarterIndex = Math.round(finalIndex * 0.75);

  document.getElementById('graph-time-start').textContent =
    formatGraphTime(timestamps[0]);

  document.getElementById('graph-time-quarter').textContent =
    formatGraphTime(timestamps[quarterIndex]);

  document.getElementById('graph-time-middle').textContent =
    formatGraphTime(timestamps[middleIndex]);

  document.getElementById(
    'graph-time-three-quarter'
  ).textContent =
    formatGraphTime(timestamps[threeQuarterIndex]);

  document.getElementById('graph-time-end').textContent =
    formatGraphTime(timestamps[finalIndex]);

  graphState.ready = true;

  updateLiveGraphCursor();
}

function interpolateForecastTemperature(timestamp) {
  const times = graphState.timestamps;
  const temperatures = graphState.temperatures;

  if (timestamp <= times[0]) {
    return temperatures[0];
  }

  if (timestamp >= times[times.length - 1]) {
    return temperatures[temperatures.length - 1];
  }

  for (let index = 0; index < times.length - 1; index++) {
    const start = times[index];
    const end = times[index + 1];

    if (timestamp >= start && timestamp <= end) {
      const progress = (timestamp - start) / (end - start);

      return (
        temperatures[index] +
        (temperatures[index + 1] - temperatures[index]) *
        progress
      );
    }
  }

  return temperatures[0];
}

function updateLiveGraphCursor() {
  if (!graphState.ready) {
    return;
  }

  const now = Date.now();

  const boundedTimestamp = Math.min(
    graphState.endTimestamp,
    Math.max(graphState.startTimestamp, now)
  );

  const temperature =
    interpolateForecastTemperature(boundedTimestamp);

  const x = timestampToX(boundedTimestamp);
  const y = temperatureToY(temperature);

  const cursorLine =
    document.getElementById('graph-cursor-line');

  const cursorHalo =
    document.getElementById('graph-cursor-halo');

  const cursorDot =
    document.getElementById('graph-cursor-dot');

  const liveValue =
    document.getElementById('graph-live-value');

  cursorLine.setAttribute('x1', x.toFixed(2));
  cursorLine.setAttribute('x2', x.toFixed(2));
  cursorLine.setAttribute('visibility', 'visible');

  cursorHalo.setAttribute('cx', x.toFixed(2));
  cursorHalo.setAttribute('cy', y.toFixed(2));
  cursorHalo.setAttribute('visibility', 'visible');

  cursorDot.setAttribute('cx', x.toFixed(2));
  cursorDot.setAttribute('cy', y.toFixed(2));
  cursorDot.setAttribute('visibility', 'visible');

  const placeLabelOnLeft = x > GRAPH.right - 100;
  const labelX = placeLabelOnLeft ? x - 12 : x + 12;

  liveValue.setAttribute('x', labelX.toFixed(2));
  liveValue.setAttribute(
    'y',
    Math.max(GRAPH.top + 18, y - 12).toFixed(2)
  );
  liveValue.setAttribute(
    'text-anchor',
    placeLabelOnLeft ? 'end' : 'start'
  );
  liveValue.setAttribute('visibility', 'visible');
  liveValue.textContent = `${Math.round(temperature)}°`;
}

function animateScanDot(timestamp) {
  if (!graphState.ready) {
    requestAnimationFrame(animateScanDot);
    return;
  }

  const cycleDuration = 8500;
  const cycleProgress =
    (timestamp % cycleDuration) / cycleDuration;

  const graphTimestamp =
    graphState.startTimestamp +
    cycleProgress *
    (
      graphState.endTimestamp -
      graphState.startTimestamp
    );

  const temperature =
    interpolateForecastTemperature(graphTimestamp);

  const x = timestampToX(graphTimestamp);
  const y = temperatureToY(temperature);

  const scanDot =
    document.getElementById('graph-scan-dot');

  scanDot.setAttribute('cx', x.toFixed(2));
  scanDot.setAttribute('cy', y.toFixed(2));
  scanDot.setAttribute('visibility', 'visible');

  requestAnimationFrame(animateScanDot);
}

function getNext24Hours(hourly) {
  if (!hourly?.time || !hourly?.temperature_2m) {
    return null;
  }

  const timestamps = hourly.time.map(
    time => new Date(time).getTime()
  );

  const now = Date.now();

  let startingIndex = timestamps.findIndex(
    timestamp => timestamp > now
  );

  if (startingIndex < 1) {
    startingIndex = 1;
  }

  /*
   * Include the previous hour so the live cursor can interpolate
   * smoothly from the current time into the future.
   */
  startingIndex -= 1;

  const endingIndex = Math.min(
    startingIndex + 25,
    hourly.time.length
  );

  return {
    timestamps: timestamps.slice(
      startingIndex,
      endingIndex
    ),
    temperatures: hourly.temperature_2m.slice(
      startingIndex,
      endingIndex
    )
  };
}

async function updateWeather() {
  try {
    const response = await fetch(WEATHER_URL);

    if (!response.ok) {
      throw new Error(
        `Weather request failed: ${response.status}`
      );
    }

    const data = await response.json();

    if (!data.current) {
      throw new Error(
        'Weather response has no current conditions'
      );
    }

    const temperature =
      Math.round(data.current.temperature_2m);

    const description =
      WEATHER_CODES[data.current.weather_code] ||
      'Weather';

    const windSpeed =
      Math.round(data.current.wind_speed_10m);

    const windDirection =
      Math.round(data.current.wind_direction_10m);

    document.getElementById('weather').textContent =
      `${temperature}°F · ${description}`;

    document.getElementById('wind-speed').textContent =
      `${windSpeed} mph`;

    document.getElementById('wind-dir').textContent =
      compassLabel(windDirection);

    /*
     * Zero degrees points north because the needle begins upright.
     */
    document.getElementById('needle').style.transform =
      `rotate(${windDirection}deg)`;

    const forecast = getNext24Hours(data.hourly);

    if (forecast) {
      renderTemperatureGraph(
        forecast.timestamps,
        forecast.temperatures
      );
    } else {
      document.getElementById('graph-readout').textContent =
        'forecast unavailable';
    }
  } catch (error) {
    console.error(error);

    document.getElementById('weather').textContent =
      'weather unavailable';

    document.getElementById('wind-speed').textContent =
      '-- mph';

    document.getElementById('wind-dir').textContent =
      '---';

    document.getElementById('graph-readout').textContent =
      'forecast unavailable';
  }
}

updateTime();
updateWeather();

setInterval(updateTime, 1000);
setInterval(updateLiveGraphCursor, 1000);
setInterval(updateWeather, 60000);

requestAnimationFrame(animateScanDot);
</script>
