<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Amber Clock</title>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #030100;
      --panel: #090301;

      --amber: #ff7a1a;
      --amber-core: #ff9230;
      --amber-hot: #ffb368;
      --amber-white: #ffd8ae;
      --amber-dim: #9a3f12;
      --amber-faint: #461705;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(
          circle at 50% 30%,
          #160602 0%,
          #050201 58%,
          #010000 100%
        );
      color: var(--amber);
      font-family: "VT323", monospace;
    }

    body {
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255, 105, 18, 0.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 105, 18, 0.032) 1px,
          transparent 1px
        );
      background-size: 8px 8px;
      opacity: 0.36;
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 140, 60, 0.018) 0,
          rgba(255, 140, 60, 0.018) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(
          circle at center,
          transparent 48%,
          rgba(0, 0, 0, 0.84) 100%
        );
    }

    #app {
      width: min(94vw, 760px);
      height: min(96dvh, 1200px);
      padding: clamp(14px, 3vw, 28px);
      display: grid;
      grid-template-rows: auto minmax(300px, 1fr);
      gap: clamp(14px, 2vh, 24px);
      border: 1px solid rgba(255, 110, 24, 0.27);
      border-radius: 18px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 110, 24, 0.045),
          rgba(0, 0, 0, 0.48)
        ),
        var(--panel);
      box-shadow:
        0 0 24px rgba(255, 72, 8, 0.16),
        0 0 72px rgba(255, 72, 8, 0.08),
        inset 0 0 46px rgba(255, 95, 18, 0.035),
        0 30px 90px rgba(0, 0, 0, 0.9);
      position: relative;
      animation: cabinet-flicker 11s steps(1, end) infinite;
    }

    @keyframes cabinet-flicker {
      0%,
      96%,
      100% {
        opacity: 1;
      }

      97% {
        opacity: 0.985;
      }

      98% {
        opacity: 0.997;
      }
    }

    .glass-panel {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 112, 25, 0.18);
      border-radius: 12px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 112, 25, 0.03),
          rgba(0, 0, 0, 0.28)
        ),
        #060201;
      box-shadow:
        inset 0 0 38px rgba(255, 76, 8, 0.045),
        inset 0 0 3px rgba(255, 180, 100, 0.12);
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          112deg,
          transparent 0%,
          rgba(255, 190, 130, 0.022) 43%,
          transparent 50%
        );
    }

    .glass-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255, 92, 14, 0.055) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 92, 14, 0.04) 1px,
          transparent 1px
        );
      background-size: 7px 7px;
      opacity: 0.3;
    }

    #display {
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 4vw, 34px);
    }

    #main,
    #wind-panel,
    #graph-content {
      position: relative;
      z-index: 1;
    }

    #main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #label,
    #wind-label,
    #graph-label {
      color: var(--amber-dim);
      font-size: clamp(17px, 3vw, 25px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.88;
      text-shadow: 0 0 5px rgba(255, 80, 10, 0.28);
    }

    #label {
      margin-bottom: clamp(6px, 1vh, 12px);
    }

    #time {
      color: var(--amber-white);
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: clamp(68px, 17vw, 128px);
      letter-spacing: -0.055em;
      line-height: 0.94;
      white-space: nowrap;
      text-shadow:
        0 0 1px rgba(255, 235, 210, 1),
        0 0 4px rgba(255, 180, 110, 0.98),
        0 0 9px rgba(255, 115, 30, 0.94),
        0 0 20px rgba(255, 70, 8, 0.65),
        0 0 38px rgba(200, 35, 0, 0.32);
      animation: phosphor-breathe 4.8s ease-in-out infinite;
    }

    @keyframes phosphor-breathe {
      0%,
      100% {
        filter: brightness(1) contrast(1.1);
      }

      50% {
        filter: brightness(1.04) contrast(1.13);
      }
    }

    #seconds {
      margin-left: 0.17em;
      font-size: 0.3em;
      opacity: 0.74;
    }

    .colon {
      animation: blink 2s steps(1, end) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.2;
      }
    }

    #weather {
      margin-top: clamp(14px, 2vh, 24px);
      color: var(--amber-core);
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(21px, 4.2vw, 34px);
      opacity: 0.94;
      text-shadow:
        0 0 3px rgba(255, 175, 95, 0.42),
        0 0 10px rgba(255, 72, 8, 0.3);
    }

    #date {
      margin-top: 8px;
      color: var(--amber-dim);
      font-size: clamp(19px, 3.6vw, 28px);
      letter-spacing: 0.08em;
      opacity: 0.84;
    }

    #wind-panel {
      width: 100%;
      margin-top: clamp(18px, 2.5vh, 30px);
      padding-top: clamp(15px, 2vh, 24px);
      border-top: 1px solid rgba(255, 94, 14, 0.2);
      display: grid;
      grid-template-columns: auto minmax(100px, 145px) 1fr;
      align-items: center;
      gap: clamp(14px, 4vw, 28px);
    }

    #wind-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.2em;
    }

    #compass {
      width: min(28vw, 140px);
      aspect-ratio: 1;
      position: relative;
      border: 1px solid rgba(255, 116, 28, 0.57);
      border-radius: 50%;
      box-shadow:
        0 0 13px rgba(255, 67, 6, 0.24),
        inset 0 0 26px rgba(255, 74, 8, 0.06);
    }

    #compass::before,
    #compass::after {
      content: "";
      position: absolute;
      background: rgba(255, 98, 18, 0.13);
    }

    #compass::before {
      top: 15%;
      bottom: 15%;
      left: 50%;
      width: 1px;
    }

    #compass::after {
      top: 50%;
      left: 15%;
      right: 15%;
      height: 1px;
    }

    .dir {
      position: absolute;
      z-index: 2;
      color: var(--amber-dim);
      font-size: clamp(17px, 3vw, 24px);
      text-shadow: 0 0 5px rgba(255, 70, 8, 0.3);
    }

    .n {
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
    }

    .e {
      top: 50%;
      right: 7%;
      transform: translateY(-50%);
    }

    .s {
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
    }

    .w {
      top: 50%;
      left: 7%;
      transform: translateY(-50%);
    }

    #needle {
      position: absolute;
      inset: 12%;
      z-index: 1;
      transition: transform 800ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #needle::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 50%;
      width: 3px;
      height: 45%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--amber-hot);
      box-shadow:
        0 0 3px rgba(255, 205, 155, 1),
        0 0 9px rgba(255, 105, 24, 0.94),
        0 0 18px rgba(255, 58, 3, 0.54);
    }

    #needle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--amber-hot);
      box-shadow:
        0 0 6px rgba(255, 190, 125, 1),
        0 0 14px rgba(255, 76, 8, 0.76);
    }

    #wind-data {
      min-width: 0;
      text-align: left;
    }

    #wind-speed {
      color: var(--amber-core);
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(25px, 5vw, 38px);
      white-space: nowrap;
      text-shadow:
        0 0 4px rgba(255, 160, 85, 0.42),
        0 0 10px rgba(255, 64, 6, 0.26);
    }

    #wind-dir {
      margin-top: 4px;
      color: var(--amber-dim);
      font-size: clamp(22px, 4vw, 31px);
      letter-spacing: 0.1em;
    }

    #graph-panel {
      min-height: 0;
      padding: clamp(14px, 3vw, 24px);
    }

    #graph-content {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #graph-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    #graph-readout {
      color: var(--amber-core);
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(15px, 3vw, 23px);
      white-space: nowrap;
      opacity: 0.94;
      text-shadow:
        0 0 4px rgba(255, 160, 85, 0.4),
        0 0 10px rgba(255, 64, 6, 0.25);
    }

    #graph-stage {
      width: 100%;
      min-height: 0;
      flex: 1;
      position: relative;
    }

    #trend-graph {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 280px;
      overflow: visible;
    }

    .graph-grid {
      stroke: rgba(255, 95, 17, 0.16);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .graph-grid.minor {
      stroke: rgba(255, 95, 17, 0.075);
    }

    .graph-fill {
      fill: url("#temperature-fill");
    }

    .graph-afterglow {
      fill: none;
      stroke: rgba(255, 67, 6, 0.28);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: url("#wide-glow");
    }

    .graph-line {
      fill: none;
      stroke: var(--amber-core);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: url("#line-glow");
      animation: trace-pulse 3.6s ease-in-out infinite;
    }

    @keyframes trace-pulse {
      0%,
      100% {
        stroke-opacity: 0.86;
      }

      50% {
        stroke-opacity: 1;
      }
    }

    .graph-cursor-line {
      stroke: rgba(255, 170, 100, 0.5);
      stroke-width: 1;
      stroke-dasharray: 3 4;
      vector-effect: non-scaling-stroke;
      filter: url("#small-glow");
    }

    .graph-cursor-halo {
      fill: rgba(255, 64, 6, 0.28);
      filter: url("#wide-glow");
    }

    .graph-cursor-dot {
      fill: var(--amber-white);
      stroke: var(--amber-core);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      filter: url("#point-glow");
    }

    .graph-scan-dot {
      fill: var(--amber-hot);
      filter: url("#point-glow");
      opacity: 0.72;
    }

    .graph-axis-label {
      fill: var(--amber-dim);
      font-family: "VT323", monospace;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .graph-y-label {
      fill: var(--amber-dim);
      font-family: "IBM Plex Mono", monospace;
      font-size: 15px;
      opacity: 0.92;
    }

    #graph-live-value {
      fill: var(--amber-hot);
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px;
      font-weight: 500;
      filter: url("#small-glow");
    }

    @media (max-height: 740px) {
      body {
        overflow: auto;
      }

      #app {
        height: auto;
        min-height: 96dvh;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="display" class="glass-panel">
      <div id="main">
        <div id="label">digital chronometer</div>

        <div id="time">
          --<span class="colon">:</span>--<span id="seconds">--</span>
        </div>

        <div id="weather">loading weather...</div>
        <div id="date"></div>
      </div>

      <div id="wind-panel">
        <div id="wind-label">wind</div>

        <div id="compass">
          <div class="dir n">N</div>
          <div class="dir e">E</div>
          <div class="dir s">S</div>
          <div class="dir w">W</div>
          <div id="needle"></div>
        </div>

        <div id="wind-data">
          <div id="wind-speed">-- mph</div>
          <div id="wind-dir">---</div>
        </div>
      </div>
    </div>

    <div id="graph-panel" class="glass-panel">
      <div id="graph-content">
        <div id="graph-header">
          <div id="graph-label">24 hour temperature</div>
          <div id="graph-readout">forecast pending</div>
        </div>

        <div id="graph-stage">
          <svg
            id="trend-graph"
            viewBox="0 0 720 340"
            preserveAspectRatio="xMidYMid meet"
          >
            <defs>
              <linearGradient
                id="temperature-fill"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >
                <stop
                  offset="0%"
                  stop-color="#ff8b28"
                  stop-opacity="0.17"
                />
                <stop
                  offset="55%"
                  stop-color="#ff6614"
                  stop-opacity="0.065"
                />
                <stop
                  offset="100%"
                  stop-color="#d93b04"
                  stop-opacity="0"
                />
              </linearGradient>

              <filter
                id="line-glow"
                x="-30%"
                y="-100%"
                width="160%"
                height="300%"
              >
                <feGaussianBlur stdDeviation="2.4" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <filter
                id="wide-glow"
                x="-40%"
                y="-150%"
                width="180%"
                height="400%"
              >
                <feGaussianBlur stdDeviation="6" />
              </filter>

              <filter
                id="small-glow"
                x="-80%"
                y="-100%"
                width="260%"
                height="300%"
              >
                <feGaussianBlur stdDeviation="1.8" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <filter
                id="point-glow"
                x="-250%"
                y="-250%"
                width="600%"
                height="600%"
              >
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <g id="graph-grid"></g>
            <g id="graph-y-labels"></g>

            <path id="graph-fill" class="graph-fill" d=""></path>
            <path id="graph-afterglow" class="graph-afterglow" d=""></path>
            <path id="graph-line" class="graph-line" d=""></path>

            <line
              id="graph-cursor-line"
              class="graph-cursor-line"
              x1="70"
              y1="20"
              x2="70"
              y2="286"
              visibility="hidden"
            ></line>

            <circle
              id="graph-cursor-halo"
              class="graph-cursor-halo"
              cx="70"
              cy="140"
              r="11"
              visibility="hidden"
            ></circle>

            <circle
              id="graph-cursor-dot"
              class="graph-cursor-dot"
              cx="70"
              cy="140"
              r="4.5"
              visibility="hidden"
            ></circle>

            <circle
              id="graph-scan-dot"
              class="graph-scan-dot"
              cx="70"
              cy="140"
              r="2.8"
              visibility="hidden"
            ></circle>

            <text
              id="graph-live-value"
              x="82"
              y="128"
              visibility="hidden"
            >
              --°
            </text>

            <text
              id="graph-time-start"
              class="graph-axis-label"
              x="70"
              y="326"
              text-anchor="start"
            ></text>

            <text
              id="graph-time-quarter"
              class="graph-axis-label"
              x="227.5"
              y="326"
              text-anchor="middle"
            ></text>

            <text
              id="graph-time-middle"
              class="graph-axis-label"
              x="385"
              y="326"
              text-anchor="middle"
            ></text>

            <text
              id="graph-time-three-quarter"
              class="graph-axis-label"
              x="542.5"
              y="326"
              text-anchor="middle"
            ></text>

            <text
              id="graph-time-end"
              class="graph-axis-label"
              x="700"
              y="326"
              text-anchor="end"
            ></text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEATHER_URL =
      'https://api.open-meteo.com/v1/forecast' +
      '?latitude=34.007' +
      '&longitude=-109.1567' +
      '&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m' +
      '&hourly=temperature_2m' +
      '&temperature_unit=fahrenheit' +
      '&wind_speed_unit=mph' +
      '&forecast_days=2' +
      '&timezone=auto';

    const WEATHER_CODES = {
      0: 'Clear',
      1: 'Mostly clear',
      2: 'Partly cloudy',
      3: 'Overcast',
      45: 'Fog',
      48: 'Rime fog',
      51: 'Light drizzle',
      53: 'Drizzle',
      55: 'Heavy drizzle',
      61: 'Light rain',
      63: 'Rain',
      65: 'Heavy rain',
      71: 'Light snow',
      73: 'Snow',
      75: 'Heavy snow',
      80: 'Rain showers',
      81: 'Rain showers',
      82: 'Heavy showers',
      95: 'Thunderstorm',
      96: 'Thunderstorm',
      99: 'Thunderstorm'
    };

    const SVG_NAMESPACE = 'http://www.w3.org/2000/svg';

    const GRAPH = {
      left: 70,
      right: 700,
      top: 20,
      bottom: 286
    };

    const graphState = {
      timestamps: [],
      temperatures: [],
      points: [],
      lowerBound: 0,
      upperBound: 1,
      startTimestamp: 0,
      endTimestamp: 0,
      ready: false
    };

    function updateTime() {
      const now = new Date();

      const parts = new Intl.DateTimeFormat([], {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      }).formatToParts(now);

      const hour =
        parts.find(part => part.type === 'hour')?.value || '--';

      const minute =
        parts.find(part => part.type === 'minute')?.value || '--';

      const second =
        parts.find(part => part.type === 'second')?.value || '--';

      document.getElementById('time').innerHTML =
        `${hour}` +
        `<span class="colon">:</span>` +
        `${minute}` +
        `<span id="seconds">${second}</span>`;

      document.getElementById('date').textContent =
        now.toLocaleDateString([], {
          weekday: 'long',
          month: 'long',
          day: 'numeric'
        });
    }

    function compassLabel(degrees) {
      const directions = [
        'N',
        'NE',
        'E',
        'SE',
        'S',
        'SW',
        'W',
        'NW'
      ];

      return directions[
        Math.round(degrees / 45) % directions.length
      ];
    }

    function formatGraphTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], {
        hour: 'numeric'
      });
    }

    function niceTemperatureStep(span) {
      if (span <= 8) {
        return 2;
      }

      if (span <= 16) {
        return 5;
      }

      if (span <= 35) {
        return 10;
      }

      return 20;
    }

    function temperatureToY(temperature) {
      const graphHeight = GRAPH.bottom - GRAPH.top;

      const span =
        graphState.upperBound -
        graphState.lowerBound;

      const normalized =
        (temperature - graphState.lowerBound) /
        span;

      return GRAPH.bottom - normalized * graphHeight;
    }

    function timestampToX(timestamp) {
      const graphWidth = GRAPH.right - GRAPH.left;

      const duration =
        graphState.endTimestamp -
        graphState.startTimestamp;

      const progress =
        (timestamp - graphState.startTimestamp) /
        duration;

      return GRAPH.left + progress * graphWidth;
    }

    function createSvgElement(tagName, attributes = {}) {
      const element =
        document.createElementNS(
          SVG_NAMESPACE,
          tagName
        );

      for (const [name, value] of Object.entries(attributes)) {
        element.setAttribute(name, value);
      }

      return element;
    }

    function renderGraphGrid() {
      const gridGroup =
        document.getElementById('graph-grid');

      const labelGroup =
        document.getElementById('graph-y-labels');

      gridGroup.replaceChildren();
      labelGroup.replaceChildren();

      const temperatureSpan =
        graphState.upperBound -
        graphState.lowerBound;

      const step =
        niceTemperatureStep(temperatureSpan);

      const firstLabel =
        Math.ceil(graphState.lowerBound / step) *
        step;

      const lastLabel =
        Math.floor(graphState.upperBound / step) *
        step;

      for (
        let temperature = firstLabel;
        temperature <= lastLabel;
        temperature += step
      ) {
        const y = temperatureToY(temperature);

        const line = createSvgElement('line', {
          class: 'graph-grid',
          x1: GRAPH.left,
          y1: y.toFixed(2),
          x2: GRAPH.right,
          y2: y.toFixed(2)
        });

        const label = createSvgElement('text', {
          class: 'graph-y-label',
          x: GRAPH.left - 12,
          y: (y + 5).toFixed(2),
          'text-anchor': 'end'
        });

        label.textContent = `${Math.round(temperature)}°F`;

        gridGroup.appendChild(line);
        labelGroup.appendChild(label);
      }

      for (const fraction of [0.25, 0.5, 0.75]) {
        const x =
          GRAPH.left +
          (GRAPH.right - GRAPH.left) *
          fraction;

        const line = createSvgElement('line', {
          class: 'graph-grid minor',
          x1: x.toFixed(2),
          y1: GRAPH.top,
          x2: x.toFixed(2),
          y2: GRAPH.bottom
        });

        gridGroup.appendChild(line);
      }
    }

    function buildSmoothPath(points) {
      if (points.length < 2) {
        return '';
      }

      let path =
        `M ${points[0][0].toFixed(2)} ` +
        `${points[0][1].toFixed(2)}`;

      for (
        let index = 0;
        index < points.length - 1;
        index++
      ) {
        const current = points[index];
        const next = points[index + 1];

        const controlX =
          current[0] +
          (next[0] - current[0]) / 2;

        path +=
          ` C ${controlX.toFixed(2)} ` +
          `${current[1].toFixed(2)},` +
          ` ${controlX.toFixed(2)} ` +
          `${next[1].toFixed(2)},` +
          ` ${next[0].toFixed(2)} ` +
          `${next[1].toFixed(2)}`;
      }

      return path;
    }

    function renderTemperatureGraph(
      timestamps,
      temperatures
    ) {
      if (
        !Array.isArray(timestamps) ||
        !Array.isArray(temperatures) ||
        timestamps.length < 2 ||
        temperatures.length < 2
      ) {
        document.getElementById(
          'graph-readout'
        ).textContent =
          'forecast unavailable';

        return;
      }

      const minimum =
        Math.min(...temperatures);

      const maximum =
        Math.max(...temperatures);

      const temperatureSpan =
        Math.max(1, maximum - minimum);

      const scaleStep =
        niceTemperatureStep(temperatureSpan);

      graphState.timestamps = timestamps;
      graphState.temperatures = temperatures;

      graphState.lowerBound =
        Math.floor(
          (minimum - scaleStep * 0.45) /
          scaleStep
        ) * scaleStep;

      graphState.upperBound =
        Math.ceil(
          (maximum + scaleStep * 0.45) /
          scaleStep
        ) * scaleStep;

      if (
        graphState.upperBound ===
        graphState.lowerBound
      ) {
        graphState.upperBound += scaleStep;
      }

      graphState.startTimestamp =
        timestamps[0];

      graphState.endTimestamp =
        timestamps[timestamps.length - 1];

      graphState.points =
        temperatures.map(
          (temperature, index) => [
            timestampToX(timestamps[index]),
            temperatureToY(temperature)
          ]
        );

      renderGraphGrid();

      const linePath =
        buildSmoothPath(graphState.points);

      const lastPoint =
        graphState.points[
          graphState.points.length - 1
        ];

      const fillPath =
        linePath +
        ` L ${lastPoint[0].toFixed(2)} ${GRAPH.bottom}` +
        ` L ${GRAPH.left} ${GRAPH.bottom} Z`;

      document
        .getElementById('graph-line')
        .setAttribute('d', linePath);

      document
        .getElementById('graph-afterglow')
        .setAttribute('d', linePath);

      document
        .getElementById('graph-fill')
        .setAttribute('d', fillPath);

      document.getElementById(
        'graph-readout'
      ).textContent =
        `${Math.round(minimum)}° — ` +
        `${Math.round(maximum)}°F`;

      const finalIndex =
        timestamps.length - 1;

      const quarterIndex =
        Math.round(finalIndex * 0.25);

      const middleIndex =
        Math.round(finalIndex * 0.5);

      const threeQuarterIndex =
        Math.round(finalIndex * 0.75);

      document.getElementById(
        'graph-time-start'
      ).textContent =
        formatGraphTime(timestamps[0]);

      document.getElementById(
        'graph-time-quarter'
      ).textContent =
        formatGraphTime(
          timestamps[quarterIndex]
        );

      document.getElementById(
        'graph-time-middle'
      ).textContent =
        formatGraphTime(
          timestamps[middleIndex]
        );

      document.getElementById(
        'graph-time-three-quarter'
      ).textContent =
        formatGraphTime(
          timestamps[threeQuarterIndex]
        );

      document.getElementById(
        'graph-time-end'
      ).textContent =
        formatGraphTime(
          timestamps[finalIndex]
        );

      graphState.ready = true;

      updateLiveGraphCursor();
    }

    function interpolateForecastTemperature(timestamp) {
      const times = graphState.timestamps;
      const temperatures = graphState.temperatures;

      if (timestamp <= times[0]) {
        return temperatures[0];
      }

      if (timestamp >= times[times.length - 1]) {
        return temperatures[temperatures.length - 1];
      }

      for (
        let index = 0;
        index < times.length - 1;
        index++
      ) {
        const start = times[index];
        const end = times[index + 1];

        if (
          timestamp >= start &&
          timestamp <= end
        ) {
          const progress =
            (timestamp - start) /
            (end - start);

          return (
            temperatures[index] +
            (
              temperatures[index + 1] -
              temperatures[index]
            ) *
            progress
          );
        }
      }

      return temperatures[0];
    }

    function updateLiveGraphCursor() {
      if (!graphState.ready) {
        return;
      }

      const now = Date.now();

      const boundedTimestamp =
        Math.min(
          graphState.endTimestamp,
          Math.max(
            graphState.startTimestamp,
            now
          )
        );

      const temperature =
        interpolateForecastTemperature(
          boundedTimestamp
        );

      const x =
        timestampToX(boundedTimestamp);

      const y =
        temperatureToY(temperature);

      const cursorLine =
        document.getElementById(
          'graph-cursor-line'
        );

      const cursorHalo =
        document.getElementById(
          'graph-cursor-halo'
        );

      const cursorDot =
        document.getElementById(
          'graph-cursor-dot'
        );

      const liveValue =
        document.getElementById(
          'graph-live-value'
        );

      cursorLine.setAttribute(
        'x1',
        x.toFixed(2)
      );

      cursorLine.setAttribute(
        'x2',
        x.toFixed(2)
      );

      cursorLine.setAttribute(
        'visibility',
        'visible'
      );

      cursorHalo.setAttribute(
        'cx',
        x.toFixed(2)
      );

      cursorHalo.setAttribute(
        'cy',
        y.toFixed(2)
      );

      cursorHalo.setAttribute(
        'visibility',
        'visible'
      );

      cursorDot.setAttribute(
        'cx',
        x.toFixed(2)
      );

      cursorDot.setAttribute(
        'cy',
        y.toFixed(2)
      );

      cursorDot.setAttribute(
        'visibility',
        'visible'
      );

      const placeLabelOnLeft =
        x > GRAPH.right - 95;

      const labelX =
        placeLabelOnLeft
          ? x - 12
          : x + 12;

      liveValue.setAttribute(
        'x',
        labelX.toFixed(2)
      );

      liveValue.setAttribute(
        'y',
        Math.max(
          GRAPH.top + 18,
          y - 12
        ).toFixed(2)
      );

      liveValue.setAttribute(
        'text-anchor',
        placeLabelOnLeft
          ? 'end'
          : 'start'
      );

      liveValue.setAttribute(
        'visibility',
        'visible'
      );

      liveValue.textContent =
        `${Math.round(temperature)}°`;
    }

    function animateScanDot(timestamp) {
      if (!graphState.ready) {
        requestAnimationFrame(
          animateScanDot
        );

        return;
      }

      const cycleDuration = 8500;

      const cycleProgress =
        (timestamp % cycleDuration) /
        cycleDuration;

      const graphTimestamp =
        graphState.startTimestamp +
        cycleProgress *
        (
          graphState.endTimestamp -
          graphState.startTimestamp
        );

      const temperature =
        interpolateForecastTemperature(
          graphTimestamp
        );

      const x =
        timestampToX(graphTimestamp);

      const y =
        temperatureToY(temperature);

      const scanDot =
        document.getElementById(
          'graph-scan-dot'
        );

      scanDot.setAttribute(
        'cx',
        x.toFixed(2)
      );

      scanDot.setAttribute(
        'cy',
        y.toFixed(2)
      );

      scanDot.setAttribute(
        'visibility',
        'visible'
      );

      requestAnimationFrame(
        animateScanDot
      );
    }

    function getNext24Hours(hourly) {
      if (
        !hourly?.time ||
        !hourly?.temperature_2m
      ) {
        return null;
      }

      const timestamps =
        hourly.time.map(
          time => new Date(time).getTime()
        );

      const now = Date.now();

      let startingIndex =
        timestamps.findIndex(
          timestamp => timestamp > now
        );

      if (startingIndex < 1) {
        startingIndex = 1;
      }

      startingIndex -= 1;

      const endingIndex =
        Math.min(
          startingIndex + 25,
          hourly.time.length
        );

      return {
        timestamps:
          timestamps.slice(
            startingIndex,
            endingIndex
          ),

        temperatures:
          hourly.temperature_2m.slice(
            startingIndex,
            endingIndex
          )
      };
    }

    async function updateWeather() {
      try {
        const response =
          await fetch(WEATHER_URL);

        if (!response.ok) {
          throw new Error(
            `Weather request failed: ${response.status}`
          );
        }

        const data =
          await response.json();

        if (!data.current) {
          throw new Error(
            'Weather response has no current conditions'
          );
        }

        const temperature =
          Math.round(
            data.current.temperature_2m
          );

        const description =
          WEATHER_CODES[
            data.current.weather_code
          ] || 'Weather';

        const windSpeed =
          Math.round(
            data.current.wind_speed_10m
          );

        const windDirection =
          Math.round(
            data.current.wind_direction_10m
          );

        document.getElementById(
          'weather'
        ).textContent =
          `${temperature}°F · ${description}`;

        document.getElementById(
          'wind-speed'
        ).textContent =
          `${windSpeed} mph`;

        document.getElementById(
          'wind-dir'
        ).textContent =
          compassLabel(windDirection);

        document.getElementById(
          'needle'
        ).style.transform =
          `rotate(${windDirection}deg)`;

        const forecast =
          getNext24Hours(data.hourly);

        if (forecast) {
          renderTemperatureGraph(
            forecast.timestamps,
            forecast.temperatures
          );
        } else {
          document.getElementById(
            'graph-readout'
          ).textContent =
            'forecast unavailable';
        }
      } catch (error) {
        console.error(error);

        document.getElementById(
          'weather'
        ).textContent =
          'weather unavailable';

        document.getElementById(
          'wind-speed'
        ).textContent =
          '-- mph';

        document.getElementById(
          'wind-dir'
        ).textContent =
          '---';

        document.getElementById(
          'graph-readout'
        ).textContent =
          'forecast unavailable';
      }
    }

    updateTime();
    updateWeather();

    setInterval(updateTime, 1000);
    setInterval(updateLiveGraphCursor, 1000);
    setInterval(updateWeather, 60000);

    requestAnimationFrame(animateScanDot);
  </script>
</body>
</html>
